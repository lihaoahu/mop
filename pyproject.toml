[project]
name = "mop"
version = "0.1.0"
description = "Mixture of Preferences: model, inference, and the case study of the paper"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Hao Li", email = "lihaoahu@126.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mop"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"experiments/**" = ["E402"]
"tests/**" = ["E402"]
