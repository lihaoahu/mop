[project]
name = "mop"
version = "0.1.0"
description = "Mixture of Preferences - model, inference, and case study"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
]

[project.optional-dependencies]
# Needed only to crawl the platform and extract judgments again. The analysis
# scripts never import these, so they are out of the default environment.
collection = [
    "article-crawler",
    "pairwise-comparison-filter",
    "pairwise-comparisons",
    "dashscope>=1.25.21",
]

[tool.uv.sources]
article-crawler = { path = "../../ArticleCrawler" }
pairwise-comparison-filter = { path = "../../PairwiseComparisonExtractor" }
pairwise-comparisons = { path = "../../PairwiseComparisons" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mop"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.15.14",
]